[project]
name = "verbacue-voice-export"
version = "0.1.0"
description = "Exports XTTS-v2 and HTDemucs to ONNX for verbacue. For developers only."
requires-python = ">=3.11,<3.12"
dependencies = [
    "coqui-tts>=0.27",
    "torch>=2.5,<2.9",
    "torchaudio>=2.5,<2.9",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "safetensors>=0.4",
    "numpy>=1.26",
    "huggingface-hub>=0.26",
    "soundfile>=0.12",
    "six>=1.16",
]

[tool.uv]
package = false
