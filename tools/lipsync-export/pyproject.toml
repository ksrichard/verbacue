[project]
name = "verbacue-lipsync-export"
version = "0.1.0"
description = "Exports the MuseTalk 1.5 lip sync models to ONNX for verbacue. For developers only."
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.5,<2.9",
    "diffusers>=0.31",
    "transformers>=4.46",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "huggingface-hub>=0.26",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "safetensors>=0.4",
]

[tool.uv]
package = false
