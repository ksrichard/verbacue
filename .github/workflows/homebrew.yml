# Publishes the Homebrew formula and cask for a release (see packaging/homebrew/).
# It writes them from the release's SHA256SUMS, installs both with real Homebrew from a
# local tap (the formula on macOS and Linux, the cask on macOS), and only then pushes
# them to github.com/ksrichard/homebrew-verbacue.
# The build workflow calls it after each release. Start it by hand with a version such
# as 0.1.0 to test or republish the tap of an existing release.
name: homebrew

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version of an existing release, such as 0.1.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the tap
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version=${VERSION#v}
          curl -fsSL -o SHA256SUMS \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/SHA256SUMS"
          packaging/homebrew/make-tap.sh "$version" SHA256SUMS homebrew-tap
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homebrew-tap
          path: homebrew-tap

  # Installs what users will install, so a formula or cask that Homebrew cannot load
  # or install never reaches the tap.
  test:
    needs: tap
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      HOMEBREW_NO_ENV_HINTS: "1"
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-tap
          path: homebrew-tap
      - name: Set up a local tap
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          brew tap-new --no-git ksrichard/verbacue
          cp -R homebrew-tap/. "$(brew --repository ksrichard/verbacue)/"
      - name: Install the formula
        run: |
          brew install ksrichard/verbacue/verbacue
          verbacue --version
          brew test ksrichard/verbacue/verbacue
          brew uninstall verbacue
      # The cask's app is quarantined like a download, so it is checked, not started.
      - name: Install the cask
        if: runner.os == 'macOS'
        run: |
          brew install --cask ksrichard/verbacue/verbacue-app
          test -d /Applications/verbacue.app
          codesign --verify --strict --verbose=2 /Applications/verbacue.app
          test -L "$(brew --prefix)/bin/verbacue"
          brew uninstall --cask verbacue-app

  # Needs the secret HOMEBREW_TAP_TOKEN: a token that may write to the contents of
  # ksrichard/homebrew-verbacue.
  publish:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: homebrew-tap
          path: homebrew-tap
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set, so the tap cannot be updated"
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/ksrichard/homebrew-verbacue.git" tap
          cp -R homebrew-tap/. tap/
          cd tap
          git add -A
          if git diff --cached --quiet; then
            echo "the tap is up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "verbacue ${VERSION#v}"
          git push origin HEAD:main
