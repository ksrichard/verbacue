<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>verbacue: preview and choose</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120e0d}
a{color:#ff8a4c}a:hover{color:#ffb38a}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes scan{0%{left:-30%}100%{left:100%}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.in{animation:fadeup .6s cubic-bezier(.2,.8,.2,1) both}
.in.d1{animation-delay:.08s}.in.d2{animation-delay:.16s}.in.d3{animation-delay:.24s}
.navlink{color:#cdbfb2;text-decoration:none;padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;font-weight:500}
.navlink:hover{background:rgba(243,233,220,.06);color:#f3e9dc}
.opt{all:unset;box-sizing:border-box;cursor:pointer;flex:1 1 240px;padding:22px;border-radius:20px;display:flex;flex-direction:column;gap:10px;transition:transform .25s,border-color .25s,background .25s}
.opt:hover{transform:translateY(-3px)}
.opt:focus-visible{outline:3px solid #ffb38a;outline-offset:3px}
.cta{display:inline-flex;align-items:center;gap:10px;background:#e8622a;color:#1a0f0a;text-decoration:none;font-weight:600;padding:16px 30px;border-radius:16px;font-size:17px;animation:pulse 2.4s ease-in-out infinite}
.cta:hover{color:#1a0f0a}
.sel{background:#1f1714;color:#f3e9dc;border:1px solid rgba(243,233,220,.14);border-radius:12px;padding:12px 14px;font:inherit;min-height:46px}
</style>
</helmet>
<div style="min-height:800px;display:flex;flex-wrap:wrap;font-family:Inter,system-ui,sans-serif;color:#f3e9dc;background:radial-gradient(1200px 600px at 70% -10%,#2b1a14 0%,#120e0d 60%)">
  <nav aria-label="Main" style="flex:1 1 220px;max-width:260px;padding:28px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid rgba(243,233,220,.07)">
    <div style="display:flex;align-items:center;gap:10px;padding:0 10px 22px">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#2b2220"></rect><rect x="5" y="15" width="24" height="3" rx="1.5" fill="#c9c2b8"></rect><rect x="7" y="11" width="6" height="11" rx="2" fill="#7a3b26"></rect><rect x="14" y="10" width="6" height="13" rx="2" fill="#3f8f3a"></rect><rect x="21" y="11" width="6" height="11" rx="2" fill="#f2c14e"></rect></svg>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px"><span style="color:#f3e9dc">verba</span><span style="color:#e8622a">cue</span></span>
    </div>
    <a class="navlink" href="Main.dc.html" style="background:rgba(232,98,42,.14);color:#ffb38a">New subtitles</a>
    <a class="navlink" href="Settings.dc.html">Settings</a>
  </nav>
  <main style="flex:999 1 560px;min-width:0;padding:40px clamp(20px,5vw,64px);display:flex;flex-direction:column;gap:26px">
    <a href="Main.dc.html" style="text-decoration:none;color:#a89a8d;font-size:14px">← Pick another video</a>
    <div style="display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start">
      <section aria-label="Preview" class="in" style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:14px">
        <div style="position:relative;aspect-ratio:16/9;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#3a2a24,#1b1412 60%,#2d1d16);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)">
          <div aria-hidden="true" style="position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,180,120,.08),transparent);animation:scan 3.5s linear infinite"></div>
          <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8f8277;font-size:15px">[VIDEO PREVIEW FRAME]</div>
          <button type="button" aria-label="Play preview" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border-radius:50%;border:0;background:rgba(243,233,220,.92);color:#1a0f0a;display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg></button>
          <div style="position:absolute;left:16px;right:16px;bottom:14px;display:flex;align-items:center;gap:12px;font-size:13px;color:#e9dccf">
            <span>0:12</span>
            <div style="flex:1;height:5px;border-radius:3px;background:rgba(243,233,220,.25);position:relative"><div style="position:absolute;inset:0 92% 0 0;border-radius:3px;background:#e8622a"></div></div>
            <span>1:42:08</span>
          </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;font-size:13px">
          <span style="padding:6px 12px;border-radius:999px;background:rgba(243,233,220,.06)">[FILE NAME].mkv</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(243,233,220,.06)">1080p · H.264</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(243,233,220,.06)">2 audio tracks</span>
          <span style="padding:6px 12px;border-radius:999px;background:rgba(63,143,58,.18);color:#bfe3b5">Language: detected on start</span>
        </div>
      </section>
      <section aria-label="Output" style="flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:18px">
        <h1 class="in d1" style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:32px;letter-spacing:-.01em">How do you want it served?</h1>
        <div class="in d2" style="display:flex;flex-wrap:wrap;gap:14px">
          <button type="button" class="opt" onClick="{{pickBurn}}" aria-pressed="{{burnOn}}" style="{{burnStyle}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff8a4c" stroke-width="2" aria-hidden="true"><path d="M12 3c2 4 6 5 6 10a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 4 5 1-3 0-6 0-8z"></path></svg>
            <span style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700">Burned in</span>
            <span style="color:#b9aa9c;font-size:14px;line-height:1.5">A new MP4 with the subtitles drawn into the picture. Plays anywhere.</span>
          </button>
          <button type="button" class="opt" onClick="{{pickSrt}}" aria-pressed="{{srtOn}}" style="{{srtStyle}}">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f2c14e" stroke-width="2" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"></path><path d="M9 13h6M9 17h4"></path></svg>
            <span style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700">Separate SRT file</span>
            <span style="color:#b9aa9c;font-size:14px;line-height:1.5">A subtitle file next to the video. Fast, and you can edit it later.</span>
          </button>
        </div>
        <div class="in d3" style="display:flex;flex-wrap:wrap;gap:14px">
          <label style="flex:1 1 180px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#a89a8d">Translate to
            <select class="sel"><option>Hungarian</option><option>English</option><option>Keep the original language</option></select>
          </label>
          <label style="flex:1 1 180px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:#a89a8d">Audio track
            <select class="sel"><option>1 · Turkish (AC3 5.1)</option><option>2 · English (AAC)</option></select>
          </label>
        </div>
        <div class="in d3" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:6px">
          <a class="cta" href="Convert.dc.html">Start grilling →</a>
          <span style="font-size:13px;color:#8f8277">Estimated time: [ESTIMATE]</span>
        </div>
      </section>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
state = { mode: 'burn' };
renderVals() {
const on = 'background:rgba(232,98,42,.14);border:2px solid #e8622a';
const off = 'background:rgba(243,233,220,.04);border:2px solid rgba(243,233,220,.1)';
const burn = this.state.mode === 'burn';
return {
burnOn: burn ? 'true' : 'false',
srtOn: burn ? 'false' : 'true',
burnStyle: burn ? on : off,
srtStyle: burn ? off : on,
pickBurn: () => this.setState({ mode: 'burn' }),
pickSrt: () => this.setState({ mode: 'srt' }),
};
}
}
</script>
</body>
</html>
