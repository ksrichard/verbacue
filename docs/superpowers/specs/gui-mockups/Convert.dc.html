<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>verbacue: converting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#120e0d}
a{color:#ff8a4c}a:hover{color:#ffb38a}
@keyframes flick{0%,100%{transform:scaleY(1) scaleX(1);opacity:.85}50%{transform:scaleY(1.25) scaleX(.92);opacity:1}}
@keyframes rise{0%{transform:translateY(0) scaleX(1);opacity:0}20%{opacity:.8}100%{transform:translateY(-120px) scaleX(.6);opacity:0}}
@keyframes sizzle{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-2deg)}75%{transform:translateY(-1px) rotate(2deg)}}
@keyframes spark{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-90px);opacity:0}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes linein{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
.flame{transform-origin:50% 100%;animation:flick .9s ease-in-out infinite}
.f2{animation-delay:.2s;animation-duration:1.1s}.f3{animation-delay:.45s;animation-duration:.8s}.f4{animation-delay:.1s;animation-duration:1.25s}
.smoke{position:absolute;height:12px;border-radius:6px;background:#f3e9dc;animation:rise 3.6s ease-out infinite}
.s2{animation-delay:1.2s}.s3{animation-delay:2.4s}
.chunk{animation:sizzle 1.4s ease-in-out infinite}
.c2{animation-delay:.3s}.c3{animation-delay:.6s}.c4{animation-delay:.9s}
.spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd36b;animation:spark 1.6s ease-out infinite}
.bar{background:linear-gradient(90deg,#e8622a,#ffb627,#e8622a);background-size:200% 100%;animation:shimmer 2s linear infinite}
.dot{animation:blink 1.2s ease-in-out infinite}
.line{animation:linein .5s ease-out both}
.navlink{color:#cdbfb2;text-decoration:none;padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:10px;font-weight:500}
.ghost{color:#cdbfb2;text-decoration:none;border:1px solid rgba(243,233,220,.18);padding:12px 20px;border-radius:14px;font-weight:500}
.ghost:hover{color:#f3e9dc;border-color:rgba(243,233,220,.35)}
</style>
</helmet>
<div style="min-height:800px;display:flex;flex-wrap:wrap;font-family:Inter,system-ui,sans-serif;color:#f3e9dc;background:radial-gradient(900px 500px at 50% 110%,#3a1c10 0%,#120e0d 65%)">
  <nav aria-label="Main" style="flex:1 1 220px;max-width:260px;padding:28px 18px;display:flex;flex-direction:column;gap:6px;border-right:1px solid rgba(243,233,220,.07)">
    <div style="display:flex;align-items:center;gap:10px;padding:0 10px 22px">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="9" fill="#2b2220"></rect><rect x="5" y="15" width="24" height="3" rx="1.5" fill="#c9c2b8"></rect><rect x="7" y="11" width="6" height="11" rx="2" fill="#7a3b26"></rect><rect x="14" y="10" width="6" height="13" rx="2" fill="#3f8f3a"></rect><rect x="21" y="11" width="6" height="11" rx="2" fill="#f2c14e"></rect></svg>
      <span style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px"><span style="color:#f3e9dc">verba</span><span style="color:#e8622a">cue</span></span>
    </div>
    <a class="navlink" href="Main.dc.html" style="background:rgba(232,98,42,.14);color:#ffb38a">New subtitles</a>
    <a class="navlink" href="Settings.dc.html">Settings</a>
  </nav>
  <main style="flex:999 1 560px;min-width:0;padding:40px clamp(20px,5vw,64px);display:flex;flex-direction:column;align-items:center;gap:28px">
    <div style="text-align:center;display:flex;flex-direction:column;gap:8px">
      <h1 style="margin:0;font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,3.4vw,40px);letter-spacing:-.01em">{{quip}}</h1>
      <p style="margin:0;color:#a89a8d">[FILE NAME].mkv · Turkish → Hungarian · burned in</p>
    </div>

    <div aria-hidden="true" style="position:relative;width:min(560px,100%);height:250px">
      <div class="smoke" style="left:22%;width:56%;top:20px"></div>
      <div class="smoke s2" style="left:30%;width:40%;top:20px"></div>
      <div class="smoke s3" style="left:38%;width:24%;top:20px"></div>
      <div style="position:absolute;left:8%;right:8%;top:120px;height:8px;border-radius:4px;background:#c9c2b8"></div>
      <div style="position:absolute;right:4%;top:116px;width:0;height:0;border-left:22px solid #c9c2b8;border-top:8px solid transparent;border-bottom:8px solid transparent"></div>
      <div style="position:absolute;left:12%;top:86px;display:flex;gap:10px">
        <div class="chunk" style="width:78px;height:72px;border-radius:14px;background:#7a3b26;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fff4e0">say</div>
        <div class="chunk c2" style="width:74px;height:78px;border-radius:14px;background:#3f8f3a;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#f2ffe8">tell</div>
        <div class="chunk c3" style="width:78px;height:72px;border-radius:14px;background:#f2c14e;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#5a3200">talk</div>
        <div class="chunk c4" style="width:78px;height:78px;border-radius:14px;background:rgba(200,64,47,.35);border:2px dashed #c8402f;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-weight:700;color:#ffb3a6">sing</div>
      </div>
      <div style="position:absolute;left:18%;right:18%;top:168px;display:flex;justify-content:space-between;align-items:flex-end">
        <div class="flame" style="width:30px;height:54px;border-radius:50% 50% 40% 40%;background:linear-gradient(0deg,#ff7a1a,#ffe680)"></div>
        <div class="flame f2" style="width:36px;height:70px;border-radius:50% 50% 40% 40%;background:linear-gradient(0deg,#ff7a1a,#ffe680)"></div>
        <div class="flame f3" style="width:32px;height:60px;border-radius:50% 50% 40% 40%;background:linear-gradient(0deg,#ff7a1a,#ffe680)"></div>
        <div class="flame f4" style="width:26px;height:48px;border-radius:50% 50% 40% 40%;background:linear-gradient(0deg,#ff7a1a,#ffe680)"></div>
      </div>
      <div class="spark" style="left:35%;top:180px;--dx:-30px"></div>
      <div class="spark" style="left:52%;top:180px;--dx:20px;animation-delay:.5s"></div>
      <div class="spark" style="left:64%;top:180px;--dx:40px;animation-delay:1s"></div>
      <div style="position:absolute;left:14%;right:14%;top:226px;height:10px;border-radius:5px;background:#5b524d"></div>
    </div>

    <div style="width:min(640px,100%);display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;font-size:14px;color:#cdbfb2"><span>{{stageName}}</span><span style="font-variant-numeric:tabular-nums">{{pct}}%</span></div>
      <div role="progressbar" aria-label="Progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{pct}}" style="height:14px;border-radius:7px;background:rgba(243,233,220,.08);overflow:hidden">
        <div class="bar" style="{{barStyle}}"></div>
      </div>
      <ol style="list-style:none;margin:8px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;font-size:13px">
        <sc-for list="{{stages}}" as="st" hint-placeholder-count="4">
          <li style="{{st.style}}"><span>{{st.icon}}</span> {{st.name}}</li>
        </sc-for>
      </ol>
    </div>

    <section aria-label="Live transcript" style="width:min(640px,100%);padding:16px 18px;border-radius:18px;background:rgba(243,233,220,.04);display:flex;flex-direction:column;gap:8px;font-size:14px">
      <div style="display:flex;align-items:center;gap:8px;color:#8f8277;font-size:12px;text-transform:uppercase;letter-spacing:.08em"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:#e8622a"></span>Fresh off the grill</div>
      <div class="line" style="color:#cdbfb2">00:01:12 · [TRANSCRIBED LINE]</div>
      <div class="line" style="color:#e9dccf;animation-delay:.3s">00:01:15 · [TRANSCRIBED LINE]</div>
    </section>

    <a class="ghost" href="Done.dc.html">Cancel</a>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
state = { pct: 8, q: 0 };
componentDidMount() {
this.t1 = setInterval(() => this.setState((s) => ({ pct: s.pct >= 100 ? 8 : s.pct + 1 })), 220);
this.t2 = setInterval(() => this.setState((s) => ({ q: (s.q + 1) % 4 })), 3200);
}
componentWillUnmount() { clearInterval(this.t1); clearInterval(this.t2); }
renderVals() {
const pct = this.state.pct;
const quips = ['Marinating the verbs…', 'Listening very carefully…', 'Flipping the nouns…', 'Adding a pinch of grammar…'];
const names = ['Read audio', 'Transcribe', 'Translate', 'Burn in'];
const stage = pct < 10 ? 0 : pct < 55 ? 1 : pct < 85 ? 2 : 3;
const stages = names.map((name, i) => ({
name,
icon: i < stage ? '✓' : i === stage ? '●' : '○',
style: 'padding:8px 10px;border-radius:10px;' + (i === stage ? 'background:rgba(232,98,42,.16);color:#ffb38a' : i < stage ? 'color:#bfe3b5' : 'color:#8f8277'),
}));
return {
pct,
quip: quips[this.state.q],
stageName: names[stage],
stages,
barStyle: 'height:100%;border-radius:7px;transition:width .2s;width:' + pct + '%',
};
}
}
</script>
</body>
</html>
