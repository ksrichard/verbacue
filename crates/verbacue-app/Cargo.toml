[package]
name = "verbacue-app"
description = "The verbacue command and desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "verbacue"
path = "src/main.rs"

[features]
default = ["gui"]
# The desktop app (`verbacue gui`, or `verbacue` with no arguments).
gui = ["dep:verbacue-gui"]
# GPU support on Linux and Windows. NVIDIA only; needs the CUDA toolkit.
cuda = ["verbacue/cuda", "verbacue-gui?/cuda"]
# GPU support on Linux and Windows for any GPU with a Vulkan driver.
vulkan = ["verbacue/vulkan", "verbacue-gui?/vulkan"]

[dependencies]
anyhow = { version = "1.0.104" }
clap = { version = "4.6.7", features = ["derive", "env"] }
indicatif = { version = "0.18.6" }
verbacue = { path = "../verbacue", version = "0.1.0", features = ["clap"] }
verbacue-gui = { path = "../verbacue-gui", version = "0.1.0", optional = true }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
