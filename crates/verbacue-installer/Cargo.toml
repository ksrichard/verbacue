[package]
name = "verbacue-installer"
description = "Finds the verbacue build that fits this computer, then downloads and installs it"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
thiserror = { version = "2.0.21" }
iced = { version = "0.14.0", features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "http2", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = { version = "0.11.1" }
tokio = { version = "1.54.1", features = ["rt", "sync"] }
verbacue-core = { path = "../verbacue-core", version = "0.3.0", features = ["http"] }

[lints]
workspace = true
